<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>banking-simulation-frontend</title>

    <style>
      :root{
        --bg: #ffffff;
        --maroon: #6b0f10;
        --maroon-dark: #4a0a0a;
        --sky: #7cc8ff;
        --muted: #0b0b0b;
        --card-shadow: rgba(107,15,16,0.12);
      }
      html,body,#root{height:100%}
      body{
        background: var(--bg);
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
      }

      .btn{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:.5rem;
        padding:.75rem 1.25rem;
        border-radius: .75rem;
        font-weight:600;
        border: none;
        cursor:pointer;
        transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      }
      .btn:disabled{opacity:.6;cursor:not-allowed}

      .btn-primary{
        background:var(--maroon);
        color:#fff;
        box-shadow: 0 6px 18px var(--card-shadow);
      }
      .btn-primary:hover{background:var(--maroon-dark);transform:translateY(-2px);}

      .btn-accent{
        background:var(--sky);
        color:var(--muted);
        box-shadow: 0 6px 18px rgba(124,200,255,0.12);
      }
      .btn-accent:hover{filter:brightness(0.95);transform:translateY(-2px);}

      .btn-ghost{
        background:transparent;
        border:2px solid rgba(11,11,11,0.08);
        color:var(--muted);
      }
      .btn-ghost:hover{background:rgba(11,11,11,0.03);transform:translateY(-2px);}

      .btn-logout{
        background:#ffffff;
        color:#000000;
        border:2px solid rgba(11,11,11,0.08);
      }
      .btn-logout:hover{background:#f7f7f7;transform:translateY(-2px);}

      .input{
        padding: .75rem 1rem;
        border-radius: .5rem;
        border:2px solid rgba(11,11,11,0.08);
        outline:none;
        transition: box-shadow .12s ease, border-color .12s ease;
      }
      .input:focus{
        box-shadow:0 6px 14px rgba(124,200,255,0.12);
        border-color:var(--sky);
      }

      .nav-btn{
        padding:.6rem 1.1rem;
        border-radius:9999px;
        font-weight:700;
        background:transparent;
        color:var(--muted);
        border:2px solid rgba(11,11,11,0.06);
        transition:all .15s ease;
      }
      .nav-btn:hover{background:var(--sky);color:#000;transform:translateY(-2px)}
      .nav-btn.active{background:var(--maroon);color:#fff;box-shadow:0 8px 24px rgba(107,15,16,0.12);transform:scale(1.03)}

      .card{
        background:#fff;
        border-radius:1rem;
        padding:1.25rem;
        box-shadow:0 8px 24px rgba(11,11,11,0.04);
      }

      .app-header{background:var(--maroon); color:#fff}

      .loading-box{background:linear-gradient(180deg, rgba(124,200,255,0.08), rgba(107,15,16,0.02)); border-left:4px solid var(--sky); color:var(--muted); padding:1rem; border-radius:.5rem}

      .message-success{background: #ecf9f3; color: #0f6639; border-left:4px solid #48b471; padding:1rem; border-radius:.5rem}
      .message-error{background:#fff2f2;color:#7a0a0a;border-left:4px solid #b83b3b;padding:1rem;border-radius:.5rem}

      .rounded-full{border-radius:9999px}
      .max-w-md{max-width:28rem}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
